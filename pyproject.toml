[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "death-proof"
version = "1.2.1"
description = "Death Proof - Fahrtenbuch als Terminal-Anwendung mit Plausibilitätsprüfung"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "openpyxl>=3.1",
    "holidays>=0.40",
    # Speichern-Dialog des Exports (Formatwahl ueber den Dateifilter).
    "textual-fspicker>=0.4.0",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
    "textual-widgets @ git+https://github.com/michaelblaess/textual-widgets.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "poethepoet>=0.29",
    "ruff>=0.3",
    # Prueft die Schichtgrenzen. Ohne ihn ist "der Kern kennt keine
    # Oberflaeche" eine Konvention, an die man sich erinnern muss.
    "import-linter>=2.0",
    "types-openpyxl>=3.1.5.20260518",
]

[project.scripts]
death-proof = "death_proof.__main__:main"

[tool.poe.tasks]
run = { cmd = "python -m death_proof", help = "Startet Death Proof" }
test = { cmd = "pytest", help = "Tests sequentiell (schnell bei Unit-Tests)" }
test-parallel = { cmd = "pytest -n auto", help = "Tests parallel (fuer langsame Test-Suiten)" }
cov = { cmd = "pytest --cov=death_proof --cov-report=term-missing", help = "Tests + Coverage" }
typecheck = { cmd = "mypy src", help = "mypy strict ueber src/" }
lint = { cmd = "ruff check .", help = "Ruff Linting" }
fmt = { cmd = "ruff format .", help = "Ruff Formatting" }
fix = { cmd = "ruff check --fix .", help = "Ruff Auto-Fix" }
layers = { cmd = "lint-imports", help = "Prueft die Schichtgrenzen (import-linter)" }

[tool.importlinter]
root_package = "death_proof"
# Fuer die Regel "der Kern zieht kein Textual" muss der Linter auch Pakete
# ausserhalb des Projekts sehen.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Schichten von oben nach unten"
type = "layers"
layers = [
    "death_proof.app",
    "death_proof.screens",
    "death_proof.widgets",
    "death_proof.services",
    "death_proof.models",
]
# Bekannte Altlast (Stand 14.09.2026): das Fahrtenbuch-Modell haelt die
# Database selbst. Sauber waere, Fahrtenbuch nach services/ zu ziehen - bis
# dahin ist genau diese eine Kante erlaubt, jede weitere bricht den Vertrag.
ignore_imports = [
    "death_proof.models.fahrtenbuch -> death_proof.services.database",
]

[[tool.importlinter.contracts]]
name = "Der Kern kennt keine Oberflaeche"
type = "forbidden"
source_modules = [
    "death_proof.services",
    "death_proof.models",
]
forbidden_modules = [
    "death_proof.app",
    "death_proof.screens",
    "death_proof.widgets",
    "textual",
    "textual_widgets",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
death_proof = ["locale/*.json"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# textual-widgets liefert (noch) keinen py.typed-Marker.
[[tool.mypy.overrides]]
module = "textual_widgets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "E402", "N806"]
