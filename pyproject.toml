[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fahrtenbuch"
version = "1.1.0"
description = "Fahrtenbuch TUI fuer Finanzamt-konforme Fahrtenbuecher"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "openpyxl>=3.1",
    "holidays>=0.40",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
]

[project.scripts]
fahrtenbuch = "fahrtenbuch_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
