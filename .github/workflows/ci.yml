name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run --extra dev ruff check .
      # Bis zum 14.09.2026 nicht in der CI: mypy lief nur lokal ueber
      # "poe typecheck" und stand auf 86 Fehlern, ohne dass es auffiel.
      - name: Typen (mypy)
        run: uv run --extra dev mypy src
      # Haelt die Schichtgrenzen fest: der Kern zieht keine Oberflaeche und
      # kein Textual. Ohne die Pruefung ist das eine Konvention.
      - name: Schichten (import-linter)
        run: uv run --extra dev lint-imports
      - name: Tests (pytest)
        run: uv run --extra dev pytest -q
