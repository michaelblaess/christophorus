# Pre-commit hooks - laufen automatisch bei jedem git commit.
# Setup: pre-commit install (einmalig pro Clone)
# Manuell:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/christo/web/static/vendor/
      - id: end-of-file-fixer
        # Fremdbibliotheken bleiben unveraendert, sie kommen ueber tools/sync_web_assets.py
        exclude: ^src/christo/web/static/vendor/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # Die mitgelieferten Fremdbibliotheken der Web-Oberflaeche (tabler.min.css ist
        # groesser als 500 KB). Sie kommen ueber tools/sync_web_assets.py, nicht von Hand.
        exclude: ^src/christo/web/static/vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Schichtgrenzen - laeuft nur, wenn Quellcode oder die Vertraege sich
  # aendern. Der Lauf dauert wenige Sekunden.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: '^(src/.*\.py|pyproject\.toml)$'

  # Lokaler pytest-Lauf - faengt Regressionen vor dem Commit ab (~schnell).
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true

  # Deutsche Commit-Nachrichten sind Lesertext und brauchen echte Umlaute.
  # Einrichten je Klon:  pre-commit install --hook-type commit-msg
  - repo: local
    hooks:
      - id: commit-nachricht
        name: Commit-Nachricht auf Ersatzschreibung pruefen
        # "sh" davor, nicht language: script - pre-commit fuehrt das Skript sonst
        # direkt aus, und unter Windows gibt es die Shebang-Zeile /bin/sh nicht.
        entry: sh tools/pruefe_commit_nachricht.sh
        language: system
        stages: [commit-msg]
